[project]
name = "wizardindex"
version = "0.1.0"
description = "A reproducible software-engineering benchmark index built from official leaderboards."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "pyyaml>=6.0",
]

[project.scripts]
wizardindex = "wizardindex.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
