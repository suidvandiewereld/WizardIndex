# What a subscription buys, in dollars of API usage per month, read by wizardindex/subsidies.py
# when the index is built. A model's effective cost is its API cost divided
# by the value per subscription dollar of the plan that buys the most of it, when that beats paying
# for the API.
#
# Source: SemiAnalysis, "Anthropic Subscriptions Offer 5x+ More Value Than OpenAI" (2026-10-05),
# https://newsletter.semianalysis.com/p/anthropic-subscriptions-offer-5x. They ran each plan to its
# weekly limit and priced the usage at first-party API list rates, on their agentic coding mix
# (0.4% input, 96.6% cached input, 2.6% cache writes, 0.3% output). Values are from the post's
# public charts as transcribed, chart by chart, in
# https://github.com/eugencowie/deepswe-enhanced/blob/main/docs/planning/subscription-data/research/semianalysis-2026-10-05.md
#
# `values` maps model id to API-equivalent dollars per month on that plan. `promo: true` marks
# figures read from a dashboard view with promotional limits switched on; they may overstate the
# plan's usual allowance. `also_serves` lists models the lab's plans serve that SemiAnalysis didn't
# measure; they get the rate of the family's first measured model (marked as estimated).

source: https://newsletter.semianalysis.com/p/anthropic-subscriptions-offer-5x
as_of: 2026-10-05

families:
  - name: Claude
    also_serves: {haiku-5-5: opus-5-5}
